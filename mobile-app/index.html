<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ناسخ التوصيات - تحكم الجوال</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4">
  <div class="max-w-md mx-auto space-y-5">

    <!-- العنوان وحالة اللابتوب -->
    <header class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold text-amber-400">TG → MT5 Copier</h1>
        <p class="text-xs text-slate-400">تحكم كامل من الجوال</p>
      </div>
      <div id="bridgeBadge" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-300">
        جاري الفحص...
      </div>
    </header>

    <!-- إعدادات الاتصال والحساب -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
      <h2 class="text-sm font-bold text-slate-200">ربط الحساب والسحابة</h2>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Firebase Database URL</label>
        <input id="dbUrl" type="url" placeholder="https://xxx.firebaseio.com"
          class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400" />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">معرّف المستخدم (User ID)</label>
        <input id="userId" type="text" placeholder="DEMO_USER_01"
          class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400" />
      </div>
      <button onclick="saveConnection()"
        class="w-full bg-slate-800 hover:bg-slate-700 text-slate-100 text-xs font-semibold py-2.5 rounded-xl transition">
        حفظ الربط وتحديث البيانات
      </button>
    </section>

    <!-- التحكم بالنسخ وإدارة اللوت -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-sm font-bold">حالة النسخ التلقائي</h2>
          <p class="text-xs text-slate-400">إيقاف أو تشغيل التنفيذ على MT5 فوراً</p>
        </div>
        <button id="toggleCopierBtn" onclick="toggleCopier()"
          class="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white transition">
          مفعّل
        </button>
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">حجم اللوت الافتراضي (Lot Size)</label>
        <div class="flex gap-2">
          <input id="lotSizeInput" type="number" step="0.01" min="0.01" value="0.01"
            class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400" />
          <button onclick="saveSettings()"
            class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-4 rounded-xl transition">
            حفظ اللوت
          </button>
        </div>
      </div>
    </section>

    <!-- إدارة قنوات التوصيات -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
      <h2 class="text-sm font-bold">قنوات التوصيات</h2>

      <div class="grid grid-cols-1 gap-2">
        <input id="chTitle" type="text" placeholder="اسم القناة (مثال: توصيات الذهب)"
          class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
        <div class="grid grid-cols-2 gap-2">
          <input id="chId" type="text" placeholder="Chat ID (مثال: -1001234567890)"
            class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
          <input id="chDefaultSymbol" type="text" placeholder="رمز افتراضي (اختياري: XAUUSD)"
            class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
        </div>
        <button onclick="addChannel()"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2.5 rounded-xl transition">
          + إضافة / تحديث القناة
        </button>
      </div>

      <div id="channelsList" class="space-y-2 pt-2">
        <p class="text-xs text-slate-500 text-center">لا توجد قنوات مضافة بعد</p>
      </div>
    </section>

    <!-- سجل الصفقات -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
      <h2 class="text-sm font-bold">آخر الصفقات المنفذة</h2>
      <div id="executionsList" class="space-y-2 text-xs">
        <p class="text-slate-500 text-center">لا توجد عمليات مسجلة بعد</p>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
